# Builds and tests the iOS app on a macOS runner (no Mac needed locally).
# Output: test results, and an unsigned .ipa as a workflow artifact.
# The unsigned .ipa cannot be installed as is. To install it, sign it with your Apple account
# (for example with a re-signing tool), or add signing to this workflow later.
name: iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          runtimes = sorted((k for k in devices if "iOS" in k), reverse=True)
          print(next(d["udid"] for k in runtimes for d in devices[k] if d["name"].startswith("iPhone")))
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep "$UDID"

      - name: Build and run the unit tests (simulator)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test \
            -project TVBoxRemote.xcodeproj \
            -scheme TVBoxRemote \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath build/TestResults.xcresult \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO \
            | tee build/test.log | grep -E "error:|warning: .*\.swift|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" build/test.log

      - name: Build for devices (unsigned)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project TVBoxRemote.xcodeproj \
            -scheme TVBoxRemote \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/TVBoxRemote.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            | tee build/archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" build/archive.log
          mkdir -p build/ipa/Payload
          cp -R build/TVBoxRemote.xcarchive/Products/Applications/TVBoxRemote.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../TVBoxRemote-unsigned.ipa Payload)

      - name: Upload the unsigned app
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxRemote-ios-unsigned
          path: ios/build/TVBoxRemote-unsigned.ipa
          if-no-files-found: error

      - name: Upload logs and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxRemote-ios-logs
          path: |
            ios/build/*.log
            ios/build/TestResults.xcresult
          if-no-files-found: ignore
