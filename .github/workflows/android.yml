# Builds, tests and lints the Android apps. Output: the debug APKs as a workflow artifact.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
        with:
          # The debug version code is the number of commits (android/build.gradle.kts).
          fetch-depth: 0

      # A new runner makes a new debug key, and an APK with another key cannot install over the one on the phone.
      # Thus the debug APKs use the same debug key as local builds (docs/RELEASE_SIGNING.md, "Upgrades").
      - name: Install the debug key
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::The secret ANDROID_DEBUG_KEYSTORE_BASE64 is not set. These debug APKs do not install over other debug builds."
            exit 0
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$HOME/.android/debug.keystore"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        run: |
          ./gradlew assembleDebug bundleRelease testDebugUnitTest lintDebug --console=plain
          echo "versionCode: $(git rev-list --count HEAD)"

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxRemote-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/receiver/build/outputs/apk/debug/receiver-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxRemote-android-reports
          path: |
            android/app/build/reports/
            android/receiver/build/reports/
          if-no-files-found: ignore
