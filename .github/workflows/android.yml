# Builds, tests and lints the Android apps. Output: the debug APKs as a workflow artifact.
name: Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        run: ./gradlew assembleDebug bundleRelease testDebugUnitTest lintDebug --console=plain

      - name: Upload the APKs
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxRemote-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/receiver/build/outputs/apk/debug/receiver-debug.apk
          if-no-files-found: error

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxRemote-android-reports
          path: |
            android/app/build/reports/
            android/receiver/build/reports/
          if-no-files-found: ignore
