# Signed release builds. Start it by hand (Actions > Release > Run workflow) or push a tag like v1.0.0.
# iOS: signs with your Apple Distribution certificate and uploads the app to TestFlight.
# Android: signs the app bundle (.aab) with your upload key. You upload it to Google Play yourself.
# It also signs a release APK with the same key, for direct installs. The APK and the bundle have the run number
# as the version code, so each one installs over the one from an earlier run (docs/RELEASE_SIGNING.md, "Upgrades").
# Receiver: signs receiver.apk and publishes it as a GitHub release, at a fixed "latest" download link.
# The secrets it needs are listed in docs/RELEASE_SIGNING.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Which apps to build
        type: choice
        options: [both, ios, android]
        default: both
      upload:
        description: Upload the iOS build to TestFlight
        type: boolean
        default: true
  push:
    tags: ["v*"]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ios:
    if: github.event_name == 'push' || inputs.platform != 'android'
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      # App Store Connect accepts only builds made with a recent iOS SDK (Xcode 26 or later now,
      # Xcode 27 or later from April 2027). Use the newest stable Xcode on the runner.
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -viE 'beta|_rc|release.candidate' | sort -V | tail -n 1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Check the secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          missing=0
          for name in APPLE_TEAM_ID IOS_DIST_CERT_P12_BASE64 IOS_DIST_CERT_PASSWORD IOS_APP_PROFILE_BASE64 \
                      IOS_WIDGET_PROFILE_BASE64 ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name is not set (docs/RELEASE_SIGNING.md)."; missing=1; fi
          done
          exit $missing

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Install the certificate and the provisioning profiles
        env:
          IOS_DIST_CERT_P12_BASE64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          IOS_APP_PROFILE_BASE64: ${{ secrets.IOS_APP_PROFILE_BASE64 }}
          IOS_WIDGET_PROFILE_BASE64: ${{ secrets.IOS_WIDGET_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

          # A temporary keychain with the distribution certificate and Apple's intermediate certificate.
          printf '%s' "$IOS_DIST_CERT_P12_BASE64" | tr -d '\r\n ' | base64 --decode > "$RUNNER_TEMP/dist.p12"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/wwdr.cer" -k "$KEYCHAIN" -T /usr/bin/codesign || true
          security import "$RUNNER_TEMP/dist.p12" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/dist.p12"
          if ! security find-identity -v -p codesigning "$KEYCHAIN" | grep -q "Apple Distribution"; then
            echo "::error::The .p12 file has no Apple Distribution certificate with its private key."
            exit 1
          fi

          # The two profiles. Their names go to the build, and each must match its bundle ID.
          install_profile() { # $1 = APP or WIDGET, $2 = base64 text, $3 = bundle ID
            file="$RUNNER_TEMP/$1.mobileprovision"
            printf '%s' "$2" | tr -d '\r\n ' | base64 --decode > "$file"
            security cms -D -i "$file" > "$RUNNER_TEMP/$1.plist"
            uuid=$(plutil -extract UUID raw "$RUNNER_TEMP/$1.plist")
            name=$(plutil -extract Name raw "$RUNNER_TEMP/$1.plist")
            appid=$(plutil -extract Entitlements.application-identifier raw "$RUNNER_TEMP/$1.plist")
            if [ "$appid" != "$TEAM_ID.$3" ]; then
              echo "::error::The $1 profile \"$name\" is for $appid. It must be for $TEAM_ID.$3."
              exit 1
            fi
            for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                       "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
              mkdir -p "$dir"
              cp "$file" "$dir/$uuid.mobileprovision"
            done
            echo "$1_PROFILE=$name" >> "$GITHUB_ENV"
            echo "$1 profile: $name ($appid)"
          }
          install_profile APP "$IOS_APP_PROFILE_BASE64" com.tvboxremote.ios
          install_profile WIDGET "$IOS_WIDGET_PROFILE_BASE64" com.tvboxremote.ios.widget

      - name: Build the signed archive
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild archive \
            -project TVBoxRemote.xcodeproj \
            -scheme TVBoxRemote \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/TVBoxRemote.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            TVBR_APP_PROFILE="$APP_PROFILE" \
            TVBR_WIDGET_PROFILE="$WIDGET_PROFILE" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            | tee build/archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" build/archive.log

      - name: Export the .ipa
        run: |
          set -o pipefail
          python3 - <<'EOF'
          import os, plistlib
          options = {
              "method": "app-store-connect",
              "teamID": os.environ["TEAM_ID"],
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "provisioningProfiles": {
                  "com.tvboxremote.ios": os.environ["APP_PROFILE"],
                  "com.tvboxremote.ios.widget": os.environ["WIDGET_PROFILE"],
              },
              "uploadSymbols": True,
              "manageAppVersionAndBuildNumber": False,
          }
          with open("build/ExportOptions.plist", "wb") as f:
              plistlib.dump(options, f)
          EOF
          xcodebuild -exportArchive \
            -archivePath build/TVBoxRemote.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export \
            | tee build/export.log | grep -E "error:|EXPORT (SUCCEEDED|FAILED)" || true
          grep -q "EXPORT SUCCEEDED" build/export.log
          ls -l build/export

      - name: Upload to TestFlight
        if: github.event_name == 'push' || inputs.upload
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | tr -d '\r\n ' | base64 --decode \
            > "$HOME/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8"
          xcrun altool --upload-app -t ios -f build/export/TVBoxRemote.ipa \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          echo "Uploaded build $BUILD_NUMBER. It shows in App Store Connect > TestFlight after Apple processes it."

      - name: Upload the signed app
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxRemote-ios-appstore
          path: |
            ios/build/export/*.ipa
            ios/build/TVBoxRemote.xcarchive/dSYMs
          if-no-files-found: error

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxRemote-ios-release-logs
          path: ios/build/*.log
          if-no-files-found: ignore

      - name: Remove the keychain and the keys
        if: always()
        run: |
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*.plist

  android:
    if: github.event_name == 'push' || inputs.platform != 'ios'
    runs-on: ubuntu-latest
    # Creates the GitHub release with receiver.apk.
    permissions:
      contents: write
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Check the secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then echo "::error::The secret $name is not set (docs/RELEASE_SIGNING.md)."; missing=1; fi
          done
          exit $missing

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the signed app bundle, the app APK and the receiver
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          ./gradlew :app:bundleRelease :app:assembleRelease :receiver:assembleRelease --console=plain
          rm "$ANDROID_KEYSTORE_FILE"
          cp receiver/build/outputs/apk/release/receiver-release.apk receiver.apk
          # The receiver has only APK signature scheme v2 and later (minSdk 24), which jarsigner cannot read.
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          if ! "$APKSIGNER" verify receiver.apk; then
            echo "::error::receiver.apk is not signed."
            exit 1
          fi
          if ! "$APKSIGNER" verify app/build/outputs/apk/release/app-release.apk; then
            echo "::error::The app APK is not signed."
            exit 1
          fi
          if ! jarsigner -verify app/build/outputs/bundle/release/app-release.aab | grep -q "jar verified"; then
            echo "::error::The app bundle is not signed."
            exit 1
          fi
          echo "versionCode: $VERSION_CODE"

      - name: Upload the signed app bundle
        uses: actions/upload-artifact@v4
        with:
          name: TVBoxRemote-android-release
          path: |
            android/app/build/outputs/bundle/release/app-release.aab
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error

      # The apps link to releases/latest/download/receiver.apk (ReceiverDownload in both apps), so every release
      # must have receiver.apk. GitHub sends that link to the newest release.
      - name: Publish receiver.apk as a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${GITHUB_REF_NAME}"; else TAG="build-${{ github.run_number }}"; fi
          gh release create "$TAG" receiver.apk             --target "$GITHUB_SHA"             --title "TVBox Remote $TAG"             --notes "Box receiver for the mouse over Wi-Fi. Install receiver.apk on the TV box. Phone apps: TestFlight and Google Play."             --latest
          echo "Published: https://github.com/${{ github.repository }}/releases/latest/download/receiver.apk"
